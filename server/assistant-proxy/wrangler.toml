name = "t-seller-assistant"
main = "worker.js"
compatibility_date = "2026-11-01"

# Any OpenAI-compatible chat-completions endpoint can be used.
[vars]
LLM_BASE_URL = "https://api.openai.com/v1"
LLM_MODEL = "gpt-4o-mini"
